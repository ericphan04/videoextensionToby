<!doctype html>
<!-- [Audit 2026-07-07] Trang loading popup web mode — hiển thị TỨC THÌ khi mở cửa sổ (parity extension),
     trước khi navigate sang labs.toby.vn (Inertia boot + fetch mất vài trăm ms). -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Loading…</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0e0e;
      }
      .wrap {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ccff00;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .label {
        color: #8b8b92;
        font-size: 13px;
        letter-spacing: 0.2px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="label">Loading…</div>
    </div>
  </body>
</html>
