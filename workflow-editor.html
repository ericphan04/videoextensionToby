      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--background, #1c1c1f);
        color: var(--foreground, #e8e8ea);
        overflow: hidden;
      }
      /* workflow.css handles .workflow-editor-overlay styles */

      /* Loading overlay — hiển thị NGAY first paint (trước khi init async fetch xong + diagram render),
       tránh body trống trơn khi mạng chậm. JS gỡ sau editor.open(). Inline để không phụ thuộc
       workflow.css load timing. */
      .wf-editor-loading {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--background, #1c1c1f);
        transition: opacity 0.3s ease;
      }
      .wf-editor-loading.wf-editor-loading-out {
        opacity: 0;
        pointer-events: none;
      }
      .wf-editor-loading__spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: var(--primary, #d3b525);
        border-radius: 50%;
        animation: wf-editor-spin 0.8s linear infinite;
      }
      .wf-editor-loading__text {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.2px;
        color: var(--muted-foreground, #9a9aa2);
      }
      @keyframes wf-editor-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
